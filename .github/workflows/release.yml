name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 target/release/droidbridge_rs.exe).Hash
          "$hash  droidbridge_rs.exe" | Out-File -Encoding ascii target/release/droidbridge_rs.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/release/droidbridge_rs.exe
            target/release/droidbridge_rs.exe.sha256
