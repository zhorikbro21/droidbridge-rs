name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 target/release/droidbridge_rs.exe).Hash
          "$hash  droidbridge_rs.exe" | Out-File -Encoding ascii target/release/droidbridge_rs.exe.sha256

      - name: Assemble portable zip (exe + adb + scrcpy)
        shell: pwsh
        run: |
          curl.exe -sL -o scrcpy.zip https://github.com/Genymobile/scrcpy/releases/download/v4.0/scrcpy-win64-v4.0.zip
          Expand-Archive scrcpy.zip -DestinationPath scrcpy
          $stage = "portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/droidbridge_rs.exe $stage/
          $src = (Get-ChildItem -Recurse -Filter scrcpy.exe scrcpy | Select-Object -First 1).DirectoryName
          Copy-Item "$src/*" $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath droidbridge-portable-windows-x64.zip -Force
          Get-ChildItem droidbridge-portable-windows-x64.zip | Select-Object Name, Length

      - name: Assemble Windows installer (Inno Setup)
        shell: pwsh
        run: |
          (Get-ChildItem -Recurse -Filter scrcpy.exe scrcpy | Select-Object -First 1).DirectoryName | Out-File -Encoding ascii scrcpy_dir.txt
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          $ws = (Get-Location).Path
          & $iscc "/DSrcExe=$ws\target\release" "/DSrcScrcpy=$(Get-Content scrcpy_dir.txt)" "/DDocsDir=$ws" "/DOutputDir=$ws\installer" "installer\droidbridge.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/release/droidbridge_rs.exe
            target/release/droidbridge_rs.exe.sha256
            droidbridge-portable-windows-x64.zip
            installer/droidbridge-setup-*.exe
